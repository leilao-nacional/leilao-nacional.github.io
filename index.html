<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="1; URL='https://s.shopee.com.br/7prtzhUlQo?share_channel_code=1'">
    <link rel="icon" type="image/x-icon" href="img/favicon.png">

    <title>Educação</title>

    
<script>
document.addEventListener('DOMContentLoaded', function () {
    const overlay = document.getElementById('avisoSessao');
    const button = document.getElementById('btnEntrarAviso');

    if (!overlay || !button) return;

    const avisoKey = 'educbrasil_aviso_entrar';
    const ttlMinutos = 30;
    const ttlMilissegundos = ttlMinutos * 60 * 1000;
    const agora = Date.now();
    const ultimoClique = Number(sessionStorage.getItem(avisoKey));

    if (!ultimoClique || agora - ultimoClique > ttlMilissegundos) {
        overlay.style.display = 'flex';
    } else {
        overlay.style.display = 'none';
    }

    button.addEventListener('click', function (event) {
        event.preventDefault();
        sessionStorage.setItem(avisoKey, String(Date.now()));
        overlay.style.display = 'none';
        window.open('https://s.shopee.com.br/7prtzhUlQo?share_channel_code=1', '_blank', 'noopener,noreferrer');
    });
});
</script>
</body>
</html>
