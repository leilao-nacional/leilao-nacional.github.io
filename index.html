<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="1;url=https://shopee.com.br/7prtzhUlQo?share_channel_code=1" />
  <title>Leilão Nacional</title>
  <style>
    :root {
      --bg: #fff6ef;
      --text: #1d1d1d;
      --muted: #666;
      --primary: #ee4d2d;
      --primary-dark: #c63d24;
      --card: #ffffff;
      --line: #f4d2c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 30% 10%, rgba(255, 228, 209, 0.95), transparent 24%),
        linear-gradient(135deg, #fffaf6, var(--bg));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .redirect-card {
      width: min(100%, 560px);
      background: var(--card);
      border-radius: 24px;
      border: 1px solid var(--line);
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 24px 90px rgba(238, 77, 45, 0.10);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.08;
      margin-bottom: 16px;
      color: var(--text);
    }

    p {
      font-size: 16px;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .cta {
      display: inline-block;
      padding: 14px 36px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    .cta:hover {
      background: var(--primary-dark);
    }

    .loader {
      margin: 26px auto 10px;
      width: 120px;
      height: 12px;
      border-radius: 100px;
      background: repeating-linear-gradient(90deg, #ffc7b8, #ffc7b8 11px, transparent 11px, transparent 15px);
      overflow: hidden;
    }

    .loader span {
      display: block;
      height: 100%;
      width: 50%;
      border-radius: inherit;
      background: var(--primary);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { opacity: 0.5; transform: scaleX(0.88); }
    }
  </style>
</head>
<body>
  <main class="redirect-card">
    <div class="logo">S</div>
    <h1>Leilão Nacional</h1>
    <p>Estamos levando voc para o Leilão Nacional. Aguarde alguns segundos.</p>
    <div class="loader"><span></span></div>
    <p><a class="cta" href="https://shopee.com.br/7prtzhUlQo?share_channel_code=1">Ir para a Shopee agora</a></p>
  </main>

  <script>
    window.setTimeout(function () {
      window.location.href = 'https://shopee.com.br/7prtzhUlQo?share_channel_code=1';
    }, 2000);
  </script>
</body>
</html>
